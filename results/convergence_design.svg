<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="470" viewBox="0 0 1320 470">
<rect width="1320" height="470" fill="#f2f5f8"/>
<text x="48" y="46" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#18283c">Monte Carlo sample-size experiment</text>
<text x="48" y="82" font-family="Arial, sans-serif" font-size="18" fill="#56677b">Nested prefixes start from seed 1000; larger sample sizes contain all smaller prefixes.</text>
<rect x="45" y="125" width="270" height="235" rx="14" fill="#ffffff" stroke="#d4dee8" stroke-width="1.5"/><text x="67" y="164" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#1c3047">25 paths</text><text x="67" y="195" font-family="Arial, sans-serif" font-size="15" fill="#66778a">Seeds 1000–1024</text><rect x="75" y="222" width="180" height="25" rx="4" fill="#4b92a8"/><text x="67" y="285" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#2d4054">Start with 25</text><text x="67" y="321" font-family="Arial, sans-serif" font-size="15" fill="#66778a">Compare means and confidence intervals</text><rect x="365" y="125" width="270" height="235" rx="14" fill="#ffffff" stroke="#d4dee8" stroke-width="1.5"/><text x="387" y="164" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#1c3047">50 paths</text><text x="387" y="195" font-family="Arial, sans-serif" font-size="15" fill="#66778a">Seeds 1000–1049</text><rect x="395" y="222" width="90" height="25" rx="4" fill="#4b92a8"/><rect x="485" y="222" width="90" height="25" rx="4" fill="#567bb3"/><text x="387" y="285" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#2d4054">25 reused + 25 added</text><text x="387" y="321" font-family="Arial, sans-serif" font-size="15" fill="#66778a">Compare means and confidence intervals</text><rect x="685" y="125" width="270" height="235" rx="14" fill="#ffffff" stroke="#d4dee8" stroke-width="1.5"/><text x="707" y="164" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#1c3047">100 paths</text><text x="707" y="195" font-family="Arial, sans-serif" font-size="15" fill="#66778a">Seeds 1000–1099</text><rect x="715" y="222" width="90" height="25" rx="4" fill="#567bb3"/><rect x="805" y="222" width="90" height="25" rx="4" fill="#9674b9"/><text x="707" y="285" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#2d4054">50 reused + 50 added</text><text x="707" y="321" font-family="Arial, sans-serif" font-size="15" fill="#66778a">Compare means and confidence intervals</text><rect x="1005" y="125" width="270" height="235" rx="14" fill="#ffffff" stroke="#d4dee8" stroke-width="1.5"/><text x="1027" y="164" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#1c3047">200 paths</text><text x="1027" y="195" font-family="Arial, sans-serif" font-size="15" fill="#66778a">Seeds 1000–1199</text><rect x="1035" y="222" width="90" height="25" rx="4" fill="#9674b9"/><rect x="1125" y="222" width="90" height="25" rx="4" fill="#b07846"/><text x="1027" y="285" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#2d4054">100 reused + 100 added</text><text x="1027" y="321" font-family="Arial, sans-serif" font-size="15" fill="#66778a">Compare means and confidence intervals</text><text x="48" y="405" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#24384e">Total path evaluations: 25 + 50 + 100 + 200 = 375</text>
<text x="48" y="439" font-family="Arial, sans-serif" font-size="16" fill="#66778a">Because prefixes overlap, these are not 375 unique independent event paths.</text>
</svg>