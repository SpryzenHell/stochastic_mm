<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="785" viewBox="0 0 1360 785">
<rect width="1360" height="785" fill="#f4f6f9"/>
<text x="50" y="48" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#172a3f">Automated test coverage</text>
<text x="50" y="83" font-family="Arial, sans-serif" font-size="18" fill="#58697b">Checks focus on numerical safety, repeatability, analysis logic and generated output files.</text><rect x="50" y="140" width="620" height="130" rx="12" fill="#ffffff" stroke="#d8e0e9" stroke-width="1.5"/><rect x="50" y="140" width="8" height="130" rx="4" fill="#3d79a8"/><text x="77" y="172" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1c3045">HJB grid and quotes</text><text x="79" y="201" font-family="Arial, sans-serif" font-size="16" fill="#445467">• Finite values across the complete grid</text><text x="79" y="223" font-family="Arial, sans-serif" font-size="16" fill="#445467">• Quote distances stay within configured limits</text><text x="79" y="245" font-family="Arial, sans-serif" font-size="16" fill="#445467">• Inventory boundary intervention is checked</text><rect x="690" y="140" width="620" height="130" rx="12" fill="#ffffff" stroke="#d8e0e9" stroke-width="1.5"/><rect x="690" y="140" width="8" height="130" rx="4" fill="#be6c4d"/><text x="717" y="172" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1c3045">Bad input and grid limits</text><text x="719" y="201" font-family="Arial, sans-serif" font-size="16" fill="#445467">• Reject NaN, infinity, negative rates and costs</text><text x="719" y="223" font-family="Arial, sans-serif" font-size="16" fill="#445467">• Reject oversized grids before allocation</text><text x="719" y="245" font-family="Arial, sans-serif" font-size="16" fill="#445467">• Reject invalid quote tick sizes</text><rect x="50" y="290" width="620" height="130" rx="12" fill="#ffffff" stroke="#d8e0e9" stroke-width="1.5"/><rect x="50" y="290" width="8" height="130" rx="4" fill="#4e9385"/><text x="77" y="322" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1c3045">Hawkes event process</text><text x="79" y="351" font-family="Arial, sans-serif" font-size="16" fill="#445467">• Same seed gives the same event path</text><text x="79" y="373" font-family="Arial, sans-serif" font-size="16" fill="#445467">• Times are sorted and event types are valid</text><text x="79" y="395" font-family="Arial, sans-serif" font-size="16" fill="#445467">• Stable intensities are finite and positive</text><rect x="690" y="290" width="620" height="130" rx="12" fill="#ffffff" stroke="#d8e0e9" stroke-width="1.5"/><rect x="690" y="290" width="8" height="130" rx="4" fill="#866bb0"/><text x="717" y="322" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1c3045">Stability and AUC</text><text x="719" y="351" font-family="Arial, sans-serif" font-size="16" fill="#445467">• Supercritical settings are marked unstable</text><text x="719" y="373" font-family="Arial, sans-serif" font-size="16" fill="#445467">• Known ROC AUC cases match expected values</text><text x="719" y="395" font-family="Arial, sans-serif" font-size="16" fill="#445467">• Tied scores use average ranks</text><rect x="50" y="440" width="620" height="130" rx="12" fill="#ffffff" stroke="#d8e0e9" stroke-width="1.5"/><rect x="50" y="440" width="8" height="130" rx="4" fill="#8b8b51"/><text x="77" y="472" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1c3045">Stored data and figures</text><text x="79" y="501" font-family="Arial, sans-serif" font-size="16" fill="#445467">• JSON numbers and summaries are checked</text><text x="79" y="523" font-family="Arial, sans-serif" font-size="16" fill="#445467">• Policy CSV row count and order are checked</text><text x="79" y="545" font-family="Arial, sans-serif" font-size="16" fill="#445467">• SVG dimensions and terminal text are checked</text><rect x="690" y="440" width="620" height="130" rx="12" fill="#ffffff" stroke="#d8e0e9" stroke-width="1.5"/><rect x="690" y="440" width="8" height="130" rx="4" fill="#bd5e8c"/><text x="717" y="472" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1c3045">Analysis utilities</text><text x="719" y="501" font-family="Arial, sans-serif" font-size="16" fill="#445467">• Parameter parsing rejects invalid grids</text><text x="719" y="523" font-family="Arial, sans-serif" font-size="16" fill="#445467">• Confidence interval estimates are tested</text><text x="719" y="545" font-family="Arial, sans-serif" font-size="16" fill="#445467">• Dominated risk/PnL settings are removed</text><rect x="50" y="590" width="620" height="130" rx="12" fill="#ffffff" stroke="#d8e0e9" stroke-width="1.5"/><rect x="50" y="590" width="8" height="130" rx="4" fill="#467eb4"/><text x="77" y="622" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1c3045">Build and integration</text><text x="79" y="651" font-family="Arial, sans-serif" font-size="16" fill="#445467">• Eigen build and no-Eigen fallback are tested</text><text x="79" y="673" font-family="Arial, sans-serif" font-size="16" fill="#445467">• Release C++ tests and Python syntax checks</text><text x="79" y="695" font-family="Arial, sans-serif" font-size="16" fill="#445467">• Full run produces CSV, JSON, PNG and SVG</text><rect x="690" y="590" width="620" height="130" rx="12" fill="#ffffff" stroke="#d8e0e9" stroke-width="1.5"/><rect x="690" y="590" width="8" height="130" rx="4" fill="#b17e36"/><text x="717" y="622" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1c3045">Parameter experiment</text><text x="719" y="651" font-family="Arial, sans-serif" font-size="16" fill="#445467">• 5 risk-aversion values × 4 cost values</text><text x="719" y="673" font-family="Arial, sans-serif" font-size="16" fill="#445467">• 25 paired paths for every setting (500 total)</text><text x="719" y="695" font-family="Arial, sans-serif" font-size="16" fill="#445467">• Output files are checked and uploaded</text><text x="50" y="765" font-family="Arial, sans-serif" font-size="16" fill="#58697b">GitHub Actions runs the build, regression tests and analysis checks on each push and pull request.</text>
</svg>